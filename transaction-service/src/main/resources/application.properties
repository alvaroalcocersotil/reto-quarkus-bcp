# ============ transaction-service :8080 ============
quarkus.http.port=8080

# --- Datasource: H2 en memoria (dev/test) ---
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:transactionsdb;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=no-file

# --- Seguridad SmallRye JWT ---
# Verifica tokens entrantes (usuarios) contra la llave pública compartida
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://bcp-challenge.com/issuer
quarkus.smallrye-jwt.enabled=true
# Firma tokens de servicio (dev/test) para llamar a los otros servicios
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.new-token.issuer=https://bcp-challenge.com/issuer

# --- REST Clients (sync entre servicios) ---
quarkus.rest-client.customer-client.url=${CUSTOMER_URL:http://localhost:8081}
quarkus.rest-client.customer-client.scope=jakarta.inject.Singleton
quarkus.rest-client.account-client.url=${ACCOUNT_URL:http://localhost:8082}
quarkus.rest-client.account-client.scope=jakarta.inject.Singleton

# --- CORS ---
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.headers=X-Correlation-ID,Idempotency-Key,Authorization,Content-Type
quarkus.http.cors.methods=GET,POST,OPTIONS

# --- Logs con correlación (MDC) ---
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%X{correlationId}] %c{2} - %m%n
quarkus.log.category."com.bcp".level=INFO

# --- OpenAPI ---
quarkus.smallrye-openapi.path=/q/openapi

%test.quarkus.http.test-port=0

