# ============ account-service :8082 ============
quarkus.http.port=8082

# --- Datasource: H2 en memoria (dev/test) ---
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:accountsdb;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

# --- Seguridad SmallRye JWT ---
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://bcp-challenge.com/issuer
quarkus.smallrye-jwt.enabled=true

# --- CORS ---
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.headers=X-Correlation-ID,Idempotency-Key,Authorization,Content-Type
quarkus.http.cors.methods=GET,POST,PATCH,OPTIONS

# --- Logs con correlación (MDC) ---
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%X{correlationId}] %c{2} - %m%n
quarkus.log.category."com.bcp".level=INFO

# --- OpenAPI ---
quarkus.smallrye-openapi.path=/q/openapi

%test.quarkus.http.test-port=0

